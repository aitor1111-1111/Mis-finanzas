.table-wrap{overflow-x:auto}.history-item{border:1px solid var(--line);border-radius:15px;padding:13px;background:#fff;margin-bottom:12px}.history-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.history-period{font-size:16px;font-weight:850}.history-status{font-size:11px;font-weight:850;padding:6px 9px;border-radius:20px;background:#edf1f3;color:var(--muted)}.history-status.good{background:#e7f5ef;color:var(--green)}.history-status.bad{background:#faeded;color:var(--red)}.history-pair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.history-balance{border-radius:11px;padding:12px;min-width:0}.history-balance.old{background:#254960;color:#fff}.history-balance.current{background:#b9d9eb;color:#17364c}.history-balance span{display:block;font-size:11px;font-weight:800;letter-spacing:.3px}.history-balance strong{display:block;font-size:clamp(17px,4.8vw,22px);font-weight:850;line-height:1.25;margin:7px 0 3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.history-balance small{font-size:11px;opacity:.85}.history-section-title{font-size:13px;font-weight:850;margin:10px 0 8px}.history-part{border:1px solid var(--line);border-radius:11px;padding:12px;margin:8px 0}.history-part-name{font-size:13px;font-weight:850;margin-bottom:9px}.history-part-values{display:grid;grid-template-columns:1fr 1fr;gap:8px}.history-part-values span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.history-part-values strong{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}.history-variation{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:10px;padding-top:9px;gap:8px}.history-variation span{font-size:11px;color:var(--muted);font-weight:800}.history-variation strong{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}.history-total{background:#f3f6f8;border-radius:12px;padding:13px;margin-top:12px}.history-total-title{font-size:14px;font-weight:900}.history-total-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin:5px 0 8px}.history-total strong{display:block;font-size:27px;font-weight:900;font-variant-numeric:tabular-nums}.history-empty{padding:16px;border:1px dashed #cbd6dc;border-radius:12px;color:var(--muted);font-size:13px;text-align:center}.history-list{display:grid;gap:10px}.history-item{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.history-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.history-period{font-size:13px;font-weight:800}.history-status{font-size:10px;font-weight:800;padding:5px 8px;border-radius:20px;background:#edf1f3;color:var(--muted)}.history-status.good{background:#e7f5ef;color:var(--green)}.history-status.bad{background:#faeded;color:var(--red)}.history-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.history-cell{background:#f5f7f8;border-radius:9px;padding:9px}.history-cell span{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.history-cell strong{font-size:14px;font-variant-numeric:tabular-nums}.history-change{margin-top:8px;padding:10px;border-radius:10px;background:#edf6f2;display:flex;justify-content:space-between;align-items:center;gap:8px}.history-change.loss{background:#faeeee}.history-change span{font-size:12px;font-weight:700}.history-change strong{font-size:18px;font-weight:850;font-variant-numeric:tabular-nums}.history-empty{padding:15px;border:1px dashed #cbd6dc;border-radius:12px;color:var(--muted);font-size:12px;text-align:center}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-size:10px}.monthline{display:grid;grid-template-columns:1fr minmax(95px,36%) auto;align-items:center;gap:8px;margin:9px 0}.monthline label{font-size:13px}.monthline input{text-align:right;padding:9px}.segment{display:flex;gap:8px}.segment label{flex:1;border:1px solid var(--line);padding:10px;border-radius:10px;font-size:12px}.segment input{width:auto;margin-right:5px}.note{background:#f3f6f8;padding:10px;border-radius:10px;color:var(--muted);font-size:11px;margin-top:9px}.status{font-size:12px;color:var(--green);margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.footer{text-align:center;color:#82909a;font-size:10px;padding:12px}
@media(min-width:600px){main{padding-top:22px}.card{padding:18px}.hero-value{font-size:35px}}

</style></head><body>
<header><div class="brand"><div class="logo">€</div><div><h1>MIS FINANZAS</h1><small>CONTROL FINANCIERO PERSONAL</small></div></div>
<div class="hero"><div class="eyebrow">PATRIMONIO DISPONIBLE</div><div class="hero-value" id="heroTotal">0,00 €</div><div class="hero-row"><span>Banco</span><strong id="heroBank">0,00 €</strong></div><div class="hero-row"><span>Efectivo</span><strong id="heroCash">0,00 €</strong></div></div>
<div class="top-cards"><div class="top-card"><span>HIPOTECA PENDIENTE</span><strong id="heroMortgage">—</strong></div><div class="top-card"><span>CUOTA MENSUAL</span><strong id="heroPayment">—</strong></div></div></header>
<main id="app"></main>
<nav><button data-tab="inicio" class="active"><span class="ico">⌂</span>Inicio</button><button data-tab="ahorros"><span class="ico">▣</span>Ahorros</button><button data-tab="hipoteca"><span class="ico">⌂</span>Hipoteca</button><button data-tab="simulador"><span class="ico">▤</span>Simulador</button></nav>
<script>
'use strict';
const KEY='misFinanzas_v1',months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const today=new Date(),monthKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),euro=n=>(Number(n)||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'}),num=v=>Math.max(0,Number(v)||0),iso=d=>d.toISOString().slice(0,10);
const blank=()=>({bank:0,home:0,remi:Array(12).fill(0),salary:0,rent:0,remiCollected:0,remiDelivered:Array(12).fill(false),savingsHistory:[],snapshots:[],mortgage:{capital:0,years:0,rate:0,payment:0,installment:0,remainingInstallments:0,startMonth:monthKey(today),lastProcessedMonth:monthKey(today)},tab:'inicio'});
const RAW_KEY='misFinanzas_respaldo_pre_comparativa_v7';
let rawBefore=null;try{rawBefore=localStorage.getItem(KEY);if(rawBefore!==null&&!localStorage.getItem(RAW_KEY))localStorage.setItem(RAW_KEY,rawBefore)}catch(e){}
let data;try{const old=JSON.parse(rawBefore||'null')||{};data={...blank(),...old};data.mortgage={...blank().mortgage,...(old.mortgage||{})};data.remi=Array.from({length:12},(_,i)=>num(old.remi?.[i]));data.remiDelivered=Array.from({length:12},(_,i)=>!!old.remiDelivered?.[i]);data.snapshots=Array.isArray(old.snapshots)?old.snapshots:[];data.savingsHistory=Array.isArray(old.savingsHistory)?old.savingsHistory:[];data.remiCollected=num(old.remiCollected);data.bank=num(old.bank);data.home=num(old.home);data.salary=num(old.salary);data.rent=num(old.rent);data.mortgage={...blank().mortgage,...(old.mortgage||{})};}catch(e){data=blank()}
function save(){localStorage.setItem(KEY,JSON.stringify(data));renderHeader()}
function available(){return num(data.bank)+num(data.home)+pendingRemi()}
function pendingRemi(){return data.remi.reduce((s,v,i)=>s+(data.remiDelivered[i]?0:num(v)),0)}
function fmtDate(s){if(!s)return '—';return new Date(s+'T12:00:00').toLocaleDateString('es-ES')}
function headerMortgage(){const m=data.mortgage;return num(m.capital)?euro(m.capital):'—'}
function renderHeader(){document.getElementById('heroTotal').textContent=euro(available());document.getElementById('heroBank').textContent=euro(data.bank);document.getElementById('heroCash').textContent=euro(num(data.home)+pendingRemi());document.getElementById('heroMortgage').textContent=headerMortgage();document.getElementById('heroPayment').textContent=num(data.mortgage.payment)?euro(data.mortgage.payment):'—'}
function field(id,label,value,type='number'){return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" '+(type==='number'?'min="0" step="0.01"':'')+' value="'+String(value??'').replace(/"/g,'&quot;')+'"></div>'}
function row(label,value,cls=''){return '<div class="row"><span class="label">'+label+'</span><strong class="value '+cls+'">'+value+'</strong></div>'}
function card(title,body){return '<section class="card"><h2>'+title+'</h2>'+body+'</section>'}
function snapshotForm(date,bank,home,remi){return {date,bank:num(bank),home:num(home),remi:num(remi),total:num(bank)+num(home)+num(remi)}}
function getSnapshot(date){return data.snapshots.find(x=>x.date===date)}
function saveSnapshot(which){saveSnapshotForm(which)}
function periodRows(){const starts=data.snapshots.filter(x=>new Date(x.date+'T12:00:00').getDate()===24).sort((a,b)=>a.date.localeCompare(b.date));return starts.map(start=>{const d=new Date(start.date+'T12:00:00'),endDate=iso(new Date(d.getFullYear(),d.getMonth()+1,23)),end=getSnapshot(endDate);return {start,end,endDate,bank:end?end.bank-start.bank:null,home:end?end.home-start.home:null,remi:end?end.remi-start.remi:null,total:end?end.total-start.total:null}})}
function renderInicio(){
 const nextStart=iso(new Date(today.getFullYear(),today.getMonth(),24));
 const initial=getSnapshot(nextStart)||{date:nextStart,bank:data.bank,home:data.home,remi:pendingRemi()};
 const nextFinal=iso(new Date(Number(initial.date.slice(0,4)),Number(initial.date.slice(5,7)),23));
 const final=getSnapshot(nextFinal)||{date:nextFinal,bank:data.bank,home:data.home,remi:pendingRemi()};
 const rows=periodRows().sort((a,b)=>b.start.date.localeCompare(a.start.date));
 const current=rows[0]||null, older=rows.slice(1);
 const money=n=>euro(n);
 const variation=(n)=>{if(n===null||n===undefined)return '—';return (n>0?'+':'')+money(n)};
 const variationClass=n=>n>0?'positive':n<0?'negative':'';
 const part=(name,a,b,done)=>{
   const delta=done?b-a:null;
   return '<div class="history-part"><div class="history-part-name">'+name+'</div><div class="history-part-values"><div><span>SALDO ANTERIOR</span><strong>'+money(a)+'</strong></div><div><span>SALDO ACTUAL</span><strong>'+(done?money(b):'Pendiente')+'</strong></div></div><div class="history-variation"><span>VARIACIÓN</span><strong class="'+(done?variationClass(delta):'')+'">'+variation(delta)+'</strong></div></div>';
 };
 const statusFor=x=>!x.end?'PENDIENTE':x.total>0?'AHORRO':x.total<0?'PÉRDIDA':'SIN VARIACIÓN';
 const statusClass=x=>!x.end?'':x.total>0?'good':x.total<0?'bad':'';
 const fullPeriod=x=>{
   const done=!!x.end,delta=done?x.total:null,status=statusFor(x);
   return '<div class="history-head"><div class="history-period">'+fmtDate(x.start.date)+' → '+fmtDate(x.endDate)+'</div><span class="history-status '+statusClass(x)+'">'+status+'</span></div>'+
    '<div class="history-pair"><div class="history-balance old"><span>SALDO ANTERIOR</span><strong>'+money(x.start.total)+'</strong><small>Día 24 · Punto de partida</small></div><div class="history-balance current"><span>SALDO ACTUAL</span><strong>'+(done?money(x.end.total):'Pendiente')+'</strong><small>Día 23 · Cierre del periodo</small></div></div>'+
    '<div class="history-section-title">Variación por partidas</div>'+
    part('BANCO',x.start.bank,x.end?x.end.bank:0,done)+
    part('EFECTIVO EN CASA',x.start.home,x.end?x.end.home:0,done)+
    part('DINERO DE REMI',x.start.remi,x.end?x.end.remi:0,done)+
    '<div class="history-total"><div class="history-total-title">PATRIMONIO TOTAL</div><div class="history-total-meta"><span>Anterior: '+money(x.start.total)+'</span><span>Actual: '+(done?money(x.end.total):'Pendiente')+'</span></div><strong class="'+(done?variationClass(delta):'')+'">'+variation(delta)+'</strong><span class="history-status '+statusClass(x)+'">'+status+'</span></div>';
 };
 const currentHtml=current?'<section class="card current-comparison"><div class="history-head"><div><h2 style="margin:0 0 3px">Comparativa del periodo más reciente</h2><div class="muted">'+fmtDate(current.start.date)+' → '+fmtDate(current.endDate)+'</div></div><span class="history-status '+statusClass(current)+'">'+statusFor(current)+'</span></div>'+fullPeriod(current)+'</section>':'<section class="card"><h2>Comparativa del periodo actual</h2><div class="history-empty">Guarda un saldo inicial del día 24 para comenzar tu comparativa.</div></section>';
 const historicalHtml=rows.length?'<div class="history-accordion-list">'+rows.map((x,i)=>{
   const done=!!x.end,delta=done?x.total:null,editing=editingPeriodDate===x.start.date;
   return '<details class="history-accordion" '+(editing?'open':'')+'><summary><div class="history-summary-top"><strong>'+fmtDate(x.start.date)+' → '+fmtDate(x.endDate)+'</strong><span class="history-status '+statusClass(x)+'">'+statusFor(x)+'</span></div><div class="history-summary-balances"><span>Anterior <b>'+money(x.start.total)+'</b></span><span>Actual <b>'+(done?money(x.end.total):'Pendiente')+'</b></span></div><div class="history-summary-change '+(done?variationClass(delta):'')+'">'+variation(delta)+'</div></summary><div class="history-accordion-content">'+fullPeriod(x)+'<div class="history-actions"><button class="secondary" onclick="editPeriod(\''+x.start.date+'\')">Editar periodo</button><button class="small" onclick="deletePeriod(\''+x.start.date+'\')">Eliminar periodo</button></div>'+(editing?periodEditor(x):'')+'</div></details>';
 }).join('')+'</div>':'<div class="history-empty">Cuando cierres nuevos periodos, aparecerán aquí. Toca cada periodo para consultar sus saldos y variaciones.</div>';
 return '<h2 class="page-title">Inicio</h2><p class="intro">Consulta tu saldo y registra las fotografías de ahorro de cada periodo.</p>'+
 card('Saldo disponible al 24 · '+months[today.getMonth()]+' '+today.getFullYear(),'<p class="muted">Datos procedentes de Ahorros. El saldo bancario ya debe incluir la nómina y los ingresos recibidos. Remi se incorpora cuando introduces su cantidad pendiente.</p>'+row('Banco',euro(data.bank))+row('Efectivo en casa',euro(data.home))+row('Dinero pendiente de Remi',euro(pendingRemi()))+'<div class="total"><div class="eyebrow" style="color:#567466">SALDO DISPONIBLE</div><div class="big">'+euro(available())+'</div></div>')+
 currentHtml+
 card('Saldo inicial · Día 24 · Después de cobrar','<p class="muted">Introduce la fecha y los saldos que abren el periodo. Los datos se guardarán en el histórico.</p>'+field('initialDate','Fecha',initial.date,'date')+field('initialBank','Saldo real del banco (€)',initial.bank)+field('initialHome','Efectivo real en casa (€)',initial.home)+field('initialRemi','Dinero que tiene Remi (€)',initial.remi)+'<div class="total">'+row('TOTAL INICIAL',euro(num(initial.bank)+num(initial.home)+num(initial.remi)))+'</div><button class="secondary" onclick="saveSnapshotForm(\'initial\')">Guardar saldo inicial</button>')+
 card('Saldo final · Día 23 · Antes de cobrar','<p class="muted">Introduce el saldo final del periodo. Al guardarlo, se incorporará al histórico y se calculará la variación.</p>'+field('finalDate','Fecha',final.date,'date')+field('finalBank','Saldo real del banco (€)',final.bank)+field('finalHome','Efectivo real en casa (€)',final.home)+field('finalRemi','Dinero que tiene Remi (€)',final.remi)+'<div class="total">'+row('TOTAL FINAL',euro(num(final.bank)+num(final.home)+num(final.remi)))+'</div><button class="primary" onclick="saveSnapshotForm(\'final\')">Guardar y ver ahorro</button>')+
 card('Histórico completo de ahorro','<p class="muted">Abre cada periodo para consultar sus cifras. Puedes editar o eliminar cada periodo guardado.</p>'+historicalHtml);
}
function periodEditor(x){
 const end=x.end;
 return '<div class="period-editor"><h3>Editar fotografía del periodo</h3><div class="muted">Modifica las fechas y los saldos y guarda los cambios.</div>'+
 '<div class="editor-grid">'+field('editStartDate','Fecha inicial (día 24)',x.start.date,'date')+field('editStartBank','Banco inicial (€)',x.start.bank)+field('editStartHome','Efectivo inicial (€)',x.start.home)+field('editStartRemi','Remi inicial (€)',x.start.remi)+'</div>'+
 (end?'<h3 style="margin-top:12px">Cierre del periodo</h3><div class="editor-grid">'+field('editEndDate','Fecha final (día 23)',x.end.date,'date')+field('editEndBank','Banco final (€)',x.end.bank)+field('editEndHome','Efectivo final (€)',x.end.home)+field('editEndRemi','Remi final (€)',x.end.remi)+'</div>':'<p class="muted">Este periodo todavía no tiene cierre. Solo se editará el saldo inicial.</p>')+
 '<div class="actions"><button class="primary" onclick="saveEditedPeriod(\''+x.start.date+'\','+(end?'true':'false')+')">Guardar cambios</button><button class="secondary" onclick="cancelEditPeriod()">Cancelar</button></div></div>';
}
function editPeriod(date){editingPeriodDate=date;render()}
function cancelEditPeriod(){editingPeriodDate=null;render()}
function saveEditedPeriod(oldStartDate,hasEnd){
 const sd=document.getElementById('editStartDate').value,sb=document.getElementById('editStartBank').value,sh=document.getElementById('editStartHome').value,sr=document.getElementById('editStartRemi').value;
 if(!sd||new Date(sd+'T12:00:00').getDate()!==24){alert('La fecha inicial debe ser un día 24.');return}
 const oldEndDate=hasEnd?iso(new Date(Number(oldStartDate.slice(0,4)),Number(oldStartDate.slice(5,7)),23)):null;
 let ed=null,eb='',eh='',er='';
 if(hasEnd){ed=document.getElementById('editEndDate').value;eb=document.getElementById('editEndBank').value;eh=document.getElementById('editEndHome').value;er=document.getElementById('editEndRemi').value;if(!ed||new Date(ed+'T12:00:00').getDate()!==23){alert('La fecha final debe ser un día 23.');return}}
 const excluded=[oldStartDate,oldEndDate].filter(Boolean),occupied=data.snapshots.filter(s=>!excluded.includes(s.date));
 if(occupied.some(s=>s.date===sd||(hasEnd&&s.date===ed))){alert('Ya existe una fotografía guardada con una de esas fechas.');return}
 data.snapshots=data.snapshots.filter(s=>!excluded.includes(s.date));
 data.snapshots.push(snapshotForm(sd,sb,sh,sr));if(hasEnd)data.snapshots.push(snapshotForm(ed,eb,eh,er));
 data.snapshots.sort((a,b)=>a.date.localeCompare(b.date));editingPeriodDate=null;save();render();alert('Periodo actualizado correctamente.');
}
function deletePeriod(startDate){
 const start=getSnapshot(startDate);if(!start)return;
 const d=new Date(startDate+'T12:00:00'),endDate=iso(new Date(d.getFullYear(),d.getMonth()+1,23)),end=getSnapshot(endDate);
 if(!confirm('¿Eliminar el periodo iniciado el '+fmtDate(startDate)+(end?' y su cierre del '+fmtDate(endDate):'')+'? Esta acción no se puede deshacer.'))return;
 data.snapshots=data.snapshots.filter(s=>s.date!==startDate&&(!end||s.date!==endDate));
 if(editingPeriodDate===startDate)editingPeriodDate=null;save();render();
}
function saveSnapshotForm(which){const date=document.getElementById(which+'Date').value,bank=document.getElementById(which+'Bank').value,home=document.getElementById(which+'Home').value,remi=document.getElementById(which+'Remi').value;if(!date){alert('Selecciona la fecha.');return}const day=new Date(date+'T12:00:00').getDate();if(which==='initial'&&day!==24){alert('El saldo inicial debe corresponder al día 24.');return}if(which==='final'&&day!==23){alert('El saldo final debe corresponder al día 23.');return}const snap=snapshotForm(date,bank,home,remi),idx=data.snapshots.findIndex(x=>x.date===date);if(idx>=0)data.snapshots[idx]=snap;else data.snapshots.push(snap);data.snapshots.sort((a,b)=>a.date.localeCompare(b.date));save();render();if(which==='final'){const d=new Date(date+'T12:00:00'),startDate=iso(new Date(d.getFullYear(),d.getMonth()-1,24)),start=getSnapshot(startDate);if(!start){alert('He guardado el saldo final, pero no encuentro el saldo inicial del día 24 del mes anterior. Comprueba que has guardado ese punto de partida.');return}const diff=snap.total-start.total;alert(diff>0?'¡Has ahorrado '+euro(diff)+'!':diff<0?'Tu patrimonio ha disminuido '+euro(Math.abs(diff))+'.':'Tu patrimonio se ha mantenido igual.')}else{alert('Saldo inicial guardado. Ya aparece como periodo pendiente en la comparativa.')}}
function renderAhorros(){const monthsHtml=months.map((m,i)=>'<div class="monthline"><label>'+m+'</label><input data-remi="'+i+'" type="number" min="0" step=".01" value="'+(data.remi[i]||'')+'" placeholder="0,00"><button class="small" onclick="deliverRemi('+i+')" '+(data.remiDelivered[i]?'disabled':'')+'>'+(data.remiDelivered[i]?'Entregado ✓':'Entregado')+'</button></div>').join('');
return '<h2 class="page-title">Ahorros</h2><p class="intro">Ingresos, banco, efectivo y control de entregas de Remi.</p>'+
card('1. Ingresos de este mes',field('salary','Ingresos del trabajo / salario (€)',data.salary)+field('remiCollected','Dinero cobrado de Remi este mes (€)',data.remiCollected)+row('Ingreso del garaje · ingresado en el banco',euro(60))+'<div class="total">'+row('TOTAL INGRESOS DEL MES',euro(num(data.salary)+num(data.remiCollected)+60))+'</div><p class="muted">Los 60 € del garaje se destinan a tu cuenta bancaria de ahorro. El saldo del banco se introduce con el importe real, para no sumarlos dos veces.</p>')+
card('2. Ahorro en el banco',field('bank','Saldo bancario (€)',data.bank)+'<p class="muted">Debe coincidir con el saldo de Inicio del día 24 después de cobrar.</p>')+
card('3. Ahorro en efectivo',field('home','Dinero real que tengo en casa (€)',data.home)+'<h3 style="font-size:14px;margin:17px 0 5px">Dinero que Remi tiene pendiente de entregarme</h3><p class="muted">Introduce las cantidades por mes. Al pulsar «Entregado» se sumará al efectivo y a los ingresos cobrados, una sola vez.</p>'+monthsHtml+'<div class="note">Remi pendiente: <strong>'+euro(pendingRemi())+'</strong>. Se incluye en el efectivo y en el patrimonio disponible. Cuando pulses «Entregado», pasa al efectivo de casa y deja de contarse como pendiente, sin duplicarse.</div>')+
card('Resumen de ahorros actuales',row('Banco',euro(data.bank))+row('Efectivo en casa',euro(data.home))+row('Remi pendiente',euro(pendingRemi()))+row('Efectivo total (casa + Remi)',euro(num(data.home)+pendingRemi()))+'<div class="total"><div class="eyebrow" style="color:#567466">PATRIMONIO DISPONIBLE</div><div class="big">'+euro(available())+'</div></div>')+
card('Copias de seguridad','<p class="muted">Exporta una copia periódica de tus datos o restaura una copia anterior.</p><div class="actions"><button class="secondary" onclick="exportBackup()">Exportar copia</button><button class="secondary" onclick="document.getElementById(\'restoreFile\').click()">Importar copia</button><input id="restoreFile" type="file" accept="application/json" hidden onchange="importBackup(event)"></div>')}
function deliverRemi(i){if(data.remiDelivered[i])return;const amount=num(data.remi[i]);if(!amount){alert('Introduce primero la cantidad pendiente de ese mes.');return}if(!confirm('¿Confirmas que has recibido '+euro(amount)+' de Remi?'))return;data.remiDelivered[i]=true;data.home=num(data.home)+amount;data.remiCollected=num(data.remiCollected)+amount;save();render()}
function renderHipoteca(){const m=data.mortgage,n=remainingMonths(),r=num(m.rate)/1200,pay=num(m.payment)||calcPayment(num(m.capital),r,n),rows=mortgageSchedule(),sumI=rows.reduce((s,x)=>s+x.interest,0),table=rows.length?rows.map(x=>'<tr><td>'+x.i+'</td><td>'+euro(x.principal)+'</td><td>'+euro(x.interest)+'</td><td>'+euro(x.payment)+'</td><td>'+euro(x.balance)+'</td></tr>').join(''):'<tr><td colspan="5" class="muted">Introduce los datos de tu hipoteca.</td></tr>';
return '<h2 class="page-title">Hipoteca</h2>'+card('Resumen de deuda',row('Capital pendiente',euro(m.capital))+row('Intereses restantes estimados',euro(sumI))+row('Total pendiente de pagar',euro(num(m.capital)+sumI))+row('Cuota mensual estimada',euro(pay))+row('Cuotas restantes',n||'—')+row('Número de cuotas abonadas',num(m.installment)))+
card('Datos de la hipoteca',field('mortCapital','Capital pendiente (€)',m.capital)+field('mortRate','Interés anual (%)',m.rate)+field('mortPayment','Cuota mensual (€)',m.payment)+field('mortRemaining','Cuotas restantes',m.remainingInstallments||n)+field('mortPaid','Cuotas abonadas',m.installment)+field('mortLast','Última cuota contabilizada (AAAA-MM)',m.lastProcessedMonth,'text')+'<button class="primary" onclick="saveMortgage()">Guardar datos de hipoteca</button><p class="muted">La cuota se contabiliza al abrir la aplicación cuando ha pasado el día 19. No se ejecuta en segundo plano.</p>')+
card('Cuadro de amortización','<p class="muted">Sistema francés. Se muestran todas las cuotas restantes.</p><div class="table-wrap"><table><thead><tr><th>Cuota</th><th>Capital</th><th>Interés</th><th>Cuota</th><th>Capital pendiente</th></tr></thead><tbody>'+table+'</tbody></table></div>')}
function calcPayment(cap,rate,n){if(!n)return 0;if(!rate)return cap/n;return cap*rate/(1-Math.pow(1+rate,-n))}
function remainingMonths(){const m=data.mortgage;if(num(m.remainingInstallments)>0)return Math.floor(num(m.remainingInstallments));return Math.max(0,num(m.years)*12-num(m.installment))}
function mortgageSchedule(){const m=data.mortgage;let bal=num(m.capital),r=num(m.rate)/1200,n=remainingMonths(),pay=num(m.payment)||calcPayment(bal,r,n),rows=[];for(let i=1;i<=n&&bal>.005;i++){const interest=bal*r,principal=Math.min(bal,Math.max(0,pay-interest)),actual=principal+interest;bal=Math.max(0,bal-principal);rows.push({i:num(m.installment)+i,principal,interest,payment:actual,balance:bal})}return rows}
function saveMortgage(){const m=data.mortgage;m.capital=num(document.getElementById('mortCapital').value);m.rate=num(document.getElementById('mortRate').value);m.payment=num(document.getElementById('mortPayment').value);m.remainingInstallments=num(document.getElementById('mortRemaining').value);m.installment=num(document.getElementById('mortPaid').value);m.lastProcessedMonth=document.getElementById('mortLast').value;save();render();alert('Datos de hipoteca guardados.')}
function processMortgage(){const m=data.mortgage;if(!num(m.capital)||!num(m.payment)||!m.lastProcessedMonth)return;const now=new Date();let due=new Date(now.getFullYear(),now.getMonth(),1);if(now.getDate()<19)due.setMonth(due.getMonth()-1);const dueKey=monthKey(due);let cursor=new Date(Number(m.lastProcessedMonth.slice(0,4)),Number(m.lastProcessedMonth.slice(5,7))-1,1);while(monthKey(cursor)<dueKey&&num(m.capital)>.005&&remainingMonths()>0){cursor.setMonth(cursor.getMonth()+1);const interest=num(m.capital)*num(m.rate)/1200,principal=Math.min(num(m.capital),Math.max(0,num(m.payment)-interest));m.capital=Math.max(0,num(m.capital)-principal);m.installment=num(m.installment)+1;m.remainingInstallments=Math.max(0,remainingMonths()-1);m.lastProcessedMonth=monthKey(cursor)}save()}
function interestFor(cap,payment,r,n){let balance=cap,total=0,count=0;while(balance>.005&&count<n&&count<1200){const interest=balance*r,principal=Math.min(balance,Math.max(0,payment-interest));if(principal<=0)break;total+=interest;balance-=principal;count++}return {interest:total,months:count}}
let simMode='plazo',simExtraRaw='0',editingPeriodDate=null;
function renderSim(){const m=data.mortgage,cap=num(m.capital),r=num(m.rate)/1200,n=remainingMonths(),pay=num(m.payment)||calcPayment(cap,r,n),extra=Math.min(cap,num(simExtra)),newCap=cap-extra,newPay=calcPayment(newCap,r,n),newN=r>0&&pay>newCap*r?Math.ceil(-Math.log(1-r*newCap/pay)/Math.log(1+r)):Math.ceil(newCap/Math.max(pay,1)),oldI=interestFor(cap,pay,r,n).interest,newI=simMode==='plazo'?interestFor(newCap,pay,r,newN).interest:interestFor(newCap,newPay,r,n).interest,saved=Math.max(0,oldI-newI);
return '<h2 class="page-title">Simulador</h2>'+card('Amortización anticipada','<p class="muted">Simulación independiente. No modifica la hipoteca real.</p>'+row('Capital pendiente',euro(cap))+field('simExtra','Importe de amortización (€)',simExtra)+'<div class="field"><label>¿Qué quieres reducir?</label><div class="segment"><label><input type="radio" name="simMode" value="plazo" '+(simMode==='plazo'?'checked':'')+'>Reducir plazo</label><label><input type="radio" name="simMode" value="cuota" '+(simMode==='cuota'?'checked':'')+'>Reducir cuota</label></div></div><div class="total">'+row('Nuevo capital pendiente',euro(newCap))+(simMode==='plazo'?row('Nueva cuota mensual',euro(pay))+row('Cuotas restantes',newN)+row('Cuotas ahorradas',Math.max(0,n-newN)):row('Nueva cuota mensual',euro(newPay))+row('Cuotas restantes',n))+ '<div class="eyebrow" style="color:#567466;margin-top:12px">AHORRO ESTIMADO EN INTERESES</div><div class="big">'+euro(saved)+'</div></div><p class="muted">Cálculo orientativo con el tipo actual constante y sin comisiones.</p>')}
function render(){renderHeader();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===data.tab));document.getElementById('app').innerHTML=data.tab==='inicio'?renderInicio():data.tab==='ahorros'?renderAhorros():data.tab==='hipoteca'?renderHipoteca():renderSim();bindInputs()}
function bindInputs(){['bank','home','salary','remiCollected'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('change',()=>{data[id]=num(el.value);save();render()})});document.querySelectorAll('[data-remi]').forEach(el=>el.addEventListener('change',()=>{data.remi[Number(el.dataset.remi)]=num(el.value);save();render()}));const ex=document.getElementById('simExtra');if(ex)ex.addEventListener('input',()=>{simExtra=num(ex.value);const pos=document.activeElement.selectionStart;render();const next=document.getElementById('simExtra');next.focus();next.setSelectionRange(pos,pos)});document.querySelectorAll('input[name="simMode"]').forEach(el=>el.addEventListener('change',()=>{simMode=el.value;render()}))}
function setTab(tab){data.tab=tab;save();render()}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function exportBackup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mis-finanzas-copia-'+monthKey(new Date())+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!d||typeof d!=='object'||!Array.isArray(d.remi)||!d.mortgage)throw Error();data={...blank(),...d,mortgage:{...blank().mortgage,...d.mortgage}};save();render();alert('Copia restaurada correctamente.')}catch(err){alert('Archivo de copia no válido.')}};reader.readAsText(f)}
processMortgage();render();
if('serviceWorker'in navigator)window.addEventListener('load',async()=>{try{const reg=await navigator.serviceWorker.register('./sw.js');await reg.update();}catch(e){console.warn('No se pudo comprobar la actualización de la aplicación',e);}});
